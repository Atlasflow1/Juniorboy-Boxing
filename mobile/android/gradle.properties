# -Duser.language/-Duser.country pin the JVM's default locale to English.
# This machine's Windows locale is Arabic with native digits, which makes
# bundletool format dex entry names with Arabic-Indic digits (e.g.
# "classes٢.dex" instead of "classes2.dex") and then fail to find the file
# it just wrote, breaking `flutter build appbundle`.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's on-disk incremental cache fails to close cleanly on this Windows machine
# ("Could not close incremental caches... already registered"), corrupting builds.
# Disabling incremental compilation avoids that storage path entirely.
kotlin.incremental=false
# The out-of-process Kotlin compile daemon fails to connect on this machine
# ("Failed connecting to the daemon in 4 retries"), likely Windows Firewall blocking
# its loopback socket with no one to approve the prompt. Compile in-process instead.
kotlin.compiler.execution.strategy=in-process
